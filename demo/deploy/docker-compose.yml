# Demo VM stack: demo server (node/hikoutei) + Caddy (static docs + API proxy)
# + QA harness (seeded local-only scenario fuzzing, ephemeral DB).
#
# Deployed by .github/workflows/demo-deploy.yml:
#   - secrets injected to /etc/hikoutei-demo.env + /etc/hikoutei-demo/sa.json
#   - VitePress build (DOCS_BASE_PATH=/) rsynced to /srv/hikoutei-docs
#
# Bare host root lands on the live demo (Caddyfile redir / -> /demo).

services:
  demo-server:
    build: ../server
    image: hikoutei-demo-server
    restart: unless-stopped
    env_file: ./secrets/demo.env
    expose:
      - "3101"
    volumes:
      - demo-data:/data
    networks: [demo]

  qa:
    build: ../../qa
    image: hikoutei-qa
    restart: unless-stopped
    # Local-only fuzzing needs no secrets. Verdict history (failures +
    # periodic summaries) persists to ../data/qa — already gitignored
    # runtime state — while the DB stays ephemeral (replay guarantee).
    # Memory-capped so a fuzz-found blowup cannot starve the demo.
    mem_limit: 768m
    environment:
      QA_PORT: 3201
      QA_TICK_MS: 5000
      QA_SYNC_SPREADSHEET_URL: ${QA_SYNC_SPREADSHEET_URL:-}
      QA_SA_JSON: ${QA_SA_JSON:-}
    expose:
      - "3201"
    volumes:
      - ../data/qa:/data:rw
    networks: [demo]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docs-dist:/srv/docs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [demo]

volumes:
  demo-data:
  caddy-data:
  caddy-config:

networks:
  demo: