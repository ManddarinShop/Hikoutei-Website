# Ops stack: log collection (Vector -> Loki) + task queue (Redis Streams).
#
# Deployed directly on the VM for now (`docker compose up -d` in this dir).
# Wiring into a deploy workflow comes after the stack proves stable.
#
# Ports are NOT published: consumers (watcher/worker) will join this
# compose network. Use `docker exec` for debugging (logcli, redis-cli).
name: hikoutei-ops
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - loki-data:/loki
      - ./loki.yml:/etc/loki/loki.yml:ro
    expose:
      - "3100"
    restart: unless-stopped

  vector:
    image: timberio/vector:0.47.0-alpine
    # Image ships a demo vector.yaml; point at ours explicitly.
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector.toml:/etc/vector/vector.toml:ro
    depends_on:
      - loki
    restart: unless-stopped

  watcher:
    build: ./worker
    environment:
      ROLE: watcher
      REDIS_URL: redis://redis:6379/0
      QA_FILE: /qa/qa-history.jsonl
      GH_REPO: ManddarinShop/Hikoutei
      AUTO_PR_PREFIXES: "QARecord user_input projection is blocked: delete is blocked by an unresolved User_Input candidate."
    volumes:
      - /opt/hikoutei-website/demo/data/qa:/qa:ro
      - /etc/hikoutei-ops/age.key:/etc/hikoutei-ops/age.key:ro
      - ./secrets:/sops:ro
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      ROLE: worker
      REDIS_URL: redis://redis:6379/0
      GH_REPO: ManddarinShop/Hikoutei
      MODEL: opencode/muse-spark-1.3-contributor-free
    volumes:
      - /etc/hikoutei-ops/age.key:/etc/hikoutei-ops/age.key:ro
      - ./secrets:/sops:ro
    depends_on:
      - redis
    restart: unless-stopped

  conductor:
    build: ./worker
    environment:
      ROLE: conductor
      REDIS_URL: redis://redis:6379/0
      GH_REPO: ManddarinShop/Hikoutei
      MODEL: opencode/muse-spark-1.3-contributor-free
      DEMO_HEALTH: http://demo-server:3101/api/health
      QA_HEALTH: http://qa:3201/api/qa-health
      INFRA_ALLOW: "deploy-demo-server-1,deploy-qa-1,deploy-caddy-1,hikoutei-ops-*"
      INFRA_AUTO_RESTART: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/hikoutei-ops/age.key:/etc/hikoutei-ops/age.key:ro
      - ./secrets:/sops:ro
    networks:
      - default
      - demo
    depends_on:
      - redis
    restart: unless-stopped

networks:
  demo:
    external: true
    name: deploy_demo

volumes:
  redis-data:
  loki-data:
