# Demo drift watch (cron).
#
# The Sep-2026 outage taught us the failure hides BELOW docker: a rogue k3s
# (Traefik + Klipper) hijacked host ports 80/443 at the iptables level while
# every container looked healthy. This job compares the host against the
# expected shape once a day so the next hijack pages us instead of lurking:
#
#   1. k3s stays down (the hijacker)
#   2. both demo containers running
#   3. :443 served via docker-proxy (no k8s listener)
#   4. public edge reports sync mode (end-to-end proof)
#   5. qa container running + /api/qa-health reachable (200 + qa payload)
#      (wiring proof only — the oracle verdict ok:false is health-ping's job,
#      which files the "QA oracle failure" issue; drift-watch must not
#      double-page on an oracle failure, only on an unreachable qa)
#
# Any mismatch fails the check (GitHub notifies) AND files/updates an
# "Infra drift detected" issue via the triage job below, so the failure is
# tracked, not just mailed. The VM user needs passwordless sudo for the
# listener check; without it step 3 errors loud instead of silently passing.
#
# Failure triage (LLM): the triage job feeds the ssh output + recent
# metrics to the triage model and appends an "AI triage" section (severity
# + RCA hypothesis + remediation) to the issue. The model only ADDS
# context — it can never suppress paging, and without TRIAGE_LLM_API_KEY
# the triage step silently skips while issue filing continues unchanged.
# Severity is rule-based, not model-based: P1 = edge/k3s/container/port,
# P2 = qa wiring only. Labels triage:P1/triage:P2, [P1] title prefix.
#
# Dry-run: workflow_dispatch with triage_dry_run=true skips SSH and renders
# the issue body from .github/triage-fixtures/ (no issue is filed).
# Live probe: workflow_dispatch with live_probe=true makes ONE real LLM
# call on fixture evidence (verifies the registered key) and files nothing.

name: Drift watch

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      triage_dry_run:
        description: "Render triage from fixtures without SSH or filing"
        type: boolean
        default: false
      live_probe:
        description: "One live LLM call on fixture evidence (uses the key, files nothing)"
        type: boolean
        default: false

# GITHUB_TOKEN needs issues:write for drift-issue filing, contents:read
# for the checkout in the triage job.
permissions:
  contents: read
  issues: write

jobs:
  check:
    if: ${{ !inputs.triage_dry_run && !inputs.live_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check host shape
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          script: |
            {
            set -euo pipefail
            fail=0

            echo "--- containers ---"
            docker ps --format '{{.Names}} {{.Status}}'
            # Project name drifts with the checkout layout (deploy-* vs
            # bare), so match either generation and reuse the names below.
            caddy=$(docker ps --format '{{.Names}}' | grep -E '^(deploy-)?caddy-1$' | head -1 || true)
            server=$(docker ps --format '{{.Names}}' | grep -E '^(deploy-)?demo-server-1$' | head -1 || true)
            qa=$(docker ps --format '{{.Names}}' | grep -E '^(deploy-)?qa-1$' | head -1 || true)
            if [ -n "$caddy" ]; then
              echo "ok: caddy $caddy running"
            else
              echo "DRIFT: caddy container missing"
              fail=1
            fi
            if [ -n "$server" ]; then
              echo "ok: demo-server $server running"
            else
              echo "DRIFT: demo-server container missing"
              fail=1
            fi
            if [ -n "$qa" ]; then
              echo "ok: qa $qa running"
            else
              echo "DRIFT: qa container missing"
              fail=1
            fi

            echo "--- k3s ---"
            if systemctl is-active --quiet k3s 2>/dev/null; then
              echo "DRIFT: k3s is active (port-hijack risk)"
              fail=1
            else
              echo "ok: k3s not active"
            fi

            echo "--- port owners ---"
            listeners=$(sudo ss -tlnp | grep -E ':443\b' || true)
            echo "$listeners"
            if echo "$listeners" | grep -q docker-proxy; then
              echo "ok: :443 served via docker-proxy"
            else
              echo "DRIFT: :443 not served via docker-proxy"
              fail=1
            fi
            if echo "$listeners" | grep -qiE 'traefik|kube-apiserver'; then
              echo "DRIFT: k8s listener present on :443"
              fail=1
            fi

            echo "--- public edge ---"
            if curl -fsS --max-time 20 https://hikoutei.cloud/api/health | grep -Eq '"syncMode"[[:space:]]*:[[:space:]]*"sync"'; then
              echo "ok: public health reports sync mode"
            else
              echo "DRIFT: public health does not report sync mode"
              fail=1
            fi

            echo "--- qa edge (wiring only) ---"
            # qa-health always answers 200, even on ok:false — so a 200
            # with the qa payload proves Caddy -> qa wiring is alive.
            if curl -fsS --max-time 20 https://hikoutei.cloud/api/qa-health | grep -Eq '"ok"[[:space:]]*:'; then
              echo "ok: qa-health reachable"
            else
              echo "DRIFT: qa-health not reachable (HTTP fail or wrong payload)"
              fail=1
            fi

            if [ "$fail" -ne 0 ]; then
              echo "=== context: caddy tail ==="
              if [ -n "$caddy" ]; then docker logs "$caddy" --tail 5 2>&1 || true; fi
              echo "=== context: demo-server tail (crash reason) ==="
              if [ -n "$server" ]; then docker logs "$server" --tail 15 2>&1 || true; fi
              echo "=== context: qa tail ==="
              if [ -n "$qa" ]; then docker logs "$qa" --tail 15 2>&1 || true; fi
              exit 1
            fi
            echo "drift check clean"
            } > /tmp/hikoutei-drift-last.log 2>&1; rc=$?
            cat /tmp/hikoutei-drift-last.log
            exit $rc

  triage:
    needs: check
    if: ${{ always() && (needs.check.result == 'failure' || inputs.triage_dry_run || inputs.live_probe) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch evidence
        id: evidence
        env:
          DRY_RUN: ${{ inputs.triage_dry_run }}
          PROBE: ${{ inputs.live_probe }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ] || [ "${PROBE}" = "true" ]; then
            cp .github/triage-fixtures/drift-sample.log ./drift.log
            echo "fixture evidence, no SSH, nothing filed below"
          else
            mkdir -p ~/.ssh
            printf '%s' "${{ secrets.DEMO_SSH_KEY }}" > ~/.ssh/drift_key
            chmod 600 ~/.ssh/drift_key
            scp -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
              -i ~/.ssh/drift_key \
              "${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_SSH_HOST }}:/tmp/hikoutei-drift-last.log" \
              ./drift.log
            rm -f ~/.ssh/drift_key
          fi
          grep -c '^DRIFT:' ./drift.log

      - name: File or update drift issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIAGE_LLM_API_KEY: ${{ secrets.TRIAGE_LLM_API_KEY }}
          TRIAGE_LLM_MODEL: ${{ vars.TRIAGE_LLM_MODEL }}
          DRY_RUN: ${{ inputs.triage_dry_run }}
          PROBE: ${{ inputs.live_probe }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            export TRIAGE_FIXTURE_RESPONSE=.github/triage-fixtures/llm-sample-response.json
          fi
          if [ "${PROBE}" = "true" ]; then
            echo "live probe: one real LLM call with the registered key"
          fi
          drift_lines=$(grep '^DRIFT:' ./drift.log || true)
          # Rule-based severity (deterministic, never model-based): anything
          # beyond qa-wiring-only is P1.
          if echo "$drift_lines" | grep -Eq 'public health|container missing|k3s is active|:443 not served|k8s listener'; then
            sev="P1"; label="triage:P1"; prefix="[P1] "
          else
            sev="P2"; label="triage:P2"; prefix=""
          fi
          sig=$(printf '%s' "$drift_lines" | sort | sha256sum | cut -c1-8)
          title="${prefix}Infra drift detected — ${sig}"
          printf '%s' "$title" > /tmp/drift-title.txt

          tail -7 ops/metrics.csv > /tmp/metrics-tail.csv 2>/dev/null || true
          gh issue list -R ManddarinShop/Hikoutei-Website --state open \
            --json number,title --limit 50 > /tmp/open-issues.json 2>/dev/null \
            || echo '[]' > /tmp/open-issues.json
          if [ "${DRY_RUN}" = "true" ]; then
            echo '[]' > /tmp/open-issues.json
          fi
          .github/scripts/llm-triage.sh --mode drift --evidence ./drift.log \
            --metrics /tmp/metrics-tail.csv --open-issues /tmp/open-issues.json \
            --out /tmp/triage.md || true

          {
            echo "Infra drift detected by the Drift watch workflow (run ${GITHUB_RUN_ID})."
            echo
            echo "Severity (rule-based): **${sev}**"
            echo
            echo '## DRIFT lines'
            echo '```'
            printf '%s\n' "$drift_lines"
            echo '```'
            echo
            echo '## Evidence tail (ssh output)'
            echo '```'
            tail -40 ./drift.log
            echo '```'
            if [ -f /tmp/triage.md ]; then
              echo
              cat /tmp/triage.md
            fi
          } > /tmp/drift-body.md

          if [ "${DRY_RUN}" = "true" ] || [ "${PROBE}" = "true" ]; then
            echo "--- title ---"; cat /tmp/drift-title.txt; echo
            echo "--- body ---"; cat /tmp/drift-body.md
            exit 0
          fi
          gh label create "$label" -R ManddarinShop/Hikoutei-Website \
            --color "d73a4a" --description "LLM-triaged infra drift" \
            2>/dev/null || true
          expected=$(cat /tmp/drift-title.txt)
          match=$(python3 -c '
          import json, sys
          issues = json.load(open("/tmp/open-issues.json"))
          print(next((str(i["number"]) for i in issues
                      if i.get("title", "") == sys.argv[1]), ""))
          ' "$expected")
          if [ -n "$match" ]; then
            echo "open issue #$match already tracks this drift — commenting only"
            gh issue comment "$match" -R ManddarinShop/Hikoutei-Website \
              --body-file /tmp/drift-body.md
            gh issue edit "$match" -R ManddarinShop/Hikoutei-Website \
              --add-label "$label" 2>/dev/null || true
          else
            gh issue create -R ManddarinShop/Hikoutei-Website \
              --title "$expected" --label "$label" --body-file /tmp/drift-body.md
          fi
