# Demo drift watch (cron).
#
# The Sep-2026 outage taught us the failure hides BELOW docker: a rogue k3s
# (Traefik + Klipper) hijacked host ports 80/443 at the iptables level while
# every container looked healthy. This job compares the host against the
# expected shape once a day so the next hijack pages us instead of lurking:
#
#   1. k3s stays down (the hijacker)
#   2. both demo containers running
#   3. :443 served via docker-proxy (no k8s listener)
#   4. public edge reports sync mode (end-to-end proof)
#   5. qa container running + /api/qa-health reachable (200 + qa payload)
#      (wiring proof only — the oracle verdict ok:false is health-ping's job,
#      which files the "QA oracle failure" issue; drift-watch must not
#      double-page on an oracle failure, only on an unreachable qa)
#
# Any mismatch fails the workflow (GitHub notifies). The VM user needs
# passwordless sudo for the listener check; without it step 3 errors loud
# instead of silently passing.

name: Drift watch

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check host shape
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          script: |
            set -euo pipefail
            fail=0

            echo "--- containers ---"
            docker ps --format '{{.Names}} {{.Status}}'
            # Project name drifts with the checkout layout (deploy-* vs
            # bare), so match either generation and reuse the names below.
            caddy=$(docker ps --format '{{.Names}}' | grep -E '^(deploy-)?caddy-1$' | head -1 || true)
            server=$(docker ps --format '{{.Names}}' | grep -E '^(deploy-)?demo-server-1$' | head -1 || true)
            qa=$(docker ps --format '{{.Names}}' | grep -E '^(deploy-)?qa-1$' | head -1 || true)
            if [ -n "$caddy" ]; then
              echo "ok: caddy $caddy running"
            else
              echo "DRIFT: caddy container missing"
              fail=1
            fi
            if [ -n "$server" ]; then
              echo "ok: demo-server $server running"
            else
              echo "DRIFT: demo-server container missing"
              fail=1
            fi
            if [ -n "$qa" ]; then
              echo "ok: qa $qa running"
            else
              echo "DRIFT: qa container missing"
              fail=1
            fi

            echo "--- k3s ---"
            if systemctl is-active --quiet k3s 2>/dev/null; then
              echo "DRIFT: k3s is active (port-hijack risk)"
              fail=1
            else
              echo "ok: k3s not active"
            fi

            echo "--- port owners ---"
            listeners=$(sudo ss -tlnp | grep -E ':443\b' || true)
            echo "$listeners"
            if echo "$listeners" | grep -q docker-proxy; then
              echo "ok: :443 served via docker-proxy"
            else
              echo "DRIFT: :443 not served via docker-proxy"
              fail=1
            fi
            if echo "$listeners" | grep -qiE 'traefik|kube-apiserver'; then
              echo "DRIFT: k8s listener present on :443"
              fail=1
            fi

            echo "--- public edge ---"
            if curl -fsS --max-time 20 https://hikoutei.cloud/api/health | grep -Eq '"syncMode"[[:space:]]*:[[:space:]]*"sync"'; then
              echo "ok: public health reports sync mode"
            else
              echo "DRIFT: public health does not report sync mode"
              fail=1
            fi

            echo "--- qa edge (wiring only) ---"
            # qa-health always answers 200, even on ok:false — so a 200
            # with the qa payload proves Caddy -> qa wiring is alive.
            if curl -fsS --max-time 20 https://hikoutei.cloud/api/qa-health | grep -Eq '"ok"[[:space:]]*:'; then
              echo "ok: qa-health reachable"
            else
              echo "DRIFT: qa-health not reachable (HTTP fail or wrong payload)"
              fail=1
            fi

            if [ "$fail" -ne 0 ]; then
              echo "=== context: caddy tail ==="
              if [ -n "$caddy" ]; then docker logs "$caddy" --tail 5 2>&1 || true; fi
              echo "=== context: demo-server tail (crash reason) ==="
              if [ -n "$server" ]; then docker logs "$server" --tail 15 2>&1 || true; fi
              echo "=== context: qa tail ==="
              if [ -n "$qa" ]; then docker logs "$qa" --tail 15 2>&1 || true; fi
              exit 1
            fi
            echo "drift check clean"
