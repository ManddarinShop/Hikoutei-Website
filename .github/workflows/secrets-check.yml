# One-shot Secrets validation. Run once via Actions UI -> Run workflow,
# paste the result, then delete this file after qa-fix.yml lands.
#
# Validates (values never printed):
#   1. HIKOUTEI_PR_TOKEN + OPENCODE_ZEN_API_KEY are set
#   2. PAT has push permission on ManddarinShop/Hikoutei (cross-repo PR target)
#   3. Zen key runs a free model (cost 0) via opencode
name: secrets-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Secrets present (names only)
        run: |
          [ -n "${{ secrets.HIKOUTEI_PR_TOKEN }}" ] && echo "HIKOUTEI_PR_TOKEN: set" || { echo "HIKOUTEI_PR_TOKEN: MISSING"; exit 1; }
          [ -n "${{ secrets.OPENCODE_ZEN_API_KEY }}" ] && echo "OPENCODE_ZEN_API_KEY: set" || { echo "OPENCODE_ZEN_API_KEY: MISSING"; exit 1; }
      - name: PAT push permission on library repo
        env:
          GH_TOKEN: ${{ secrets.HIKOUTEI_PR_TOKEN }}
        run: gh api repos/ManddarinShop/Hikoutei --jq '.permissions'
      - name: Zen key runs free model
        env:
          OPENCODE_AUTH_CONTENT: '{"opencode":{"type":"api","key":"${{ secrets.OPENCODE_ZEN_API_KEY }}"}}'
        run: |
          curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode auth list
          timeout 120 opencode run --auto --model opencode/muse-spark-1.3-contributor-free "reply with only the word ok"
