# Live soak verification run — #381 + #364 closure evidence
#
# Runs the vendored soak engine against the LIVE QA sheet (sync env), so the
# tombstone-race and shifted-edit guards are exercised in the environment the
# issues were filed from. Self-contained: builds the engine's own deps, runs
# against /tmp state, writes an artifact summary that the workflow prints.
#
# Requires the QA sheet secrets (QA_SYNC_SPREADSHEET_URL, QA_SA_JSON) and the
# SSH secrets — same set as demo-deploy.

name: Live soak verification

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: "Run duration in hours (fractions OK, e.g. 0.02)"
        required: false
        default: "0.02"

permissions:
  contents: read

jobs:
  live-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run live soak on the VM
        uses: appleboy/ssh-action@v1
        env:
          DURATION: ${{ inputs.duration_hours || '0.02' }}
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          envs: DURATION
          script: |
            set -euo pipefail
            cd /opt/hikoutei-website
            # Extract values WITHOUT sourcing: bash `source` strips the JSON
            # double quotes (VM bash 5.2 test-confirmed) and an unquoted
            # SA JSON is invalid. sed reads the raw line bytes.
            export HIKOUTEI_SYNC_SPREADSHEET_URL=$(sed -n 's/^HIKOUTEI_SYNC_SPREADSHEET_URL=//p' demo/deploy/secrets/demo.env)
            mkdir -p /tmp/qa-sa
            sed -n 's/^DEMO_SA_JSON=//p' demo/deploy/secrets/demo.env > /tmp/qa-sa/sa.json
            python3 -m json.tool /tmp/qa-sa/sa.json > /dev/null
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/qa-sa/sa.json

            # Run the vendored engine inside the qa image (node + deps live
            # there; the VM host has no npm). A fresh container per run keeps
            # the ephemeral-DB replay guarantee.
            docker compose -f demo/deploy/docker-compose.yml up -d --build qa >/dev/null 2>&1
            QIMG=$(docker inspect --format '{{.Config.Image}}' $(docker ps -aq --filter "name=qa" | head -1))
            # Key material: docker run --env-file strips JSON quotes on some
            # shells (compose env_file does not — that's why the demo works).
            # Write a key FILE and point GOOGLE_APPLICATION_CREDENTIALS at it
            # — the same auth shape the demo server uses.
            docker run --rm \
              -e HIKOUTEI_SYNC_SPREADSHEET_URL="$HIKOUTEI_SYNC_SPREADSHEET_URL" \
              -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
              -v /tmp/qa-sa/sa.json:/tmp/sa.json:ro \
              -v /tmp/live-verify:/tmp/live-verify \
              --entrypoint node "$QIMG" \
              vendor/run-local-multitable-soak.mjs \
              --duration-hours "$DURATION" \
              --output-dir /tmp/live-verify/run 2>&1 | tail -40
            rm -rf /tmp/qa-sa