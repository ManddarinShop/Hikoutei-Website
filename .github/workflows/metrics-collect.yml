# Daily ops metrics (committed CSV, no backend).
#
# Appends one row per day — public health numbers plus the SQLite size from
# the host — to ops/metrics.csv, so trends (uptime resets, request failures,
# DB growth) are visible as repo history instead of someone's memory. This
# CSV is the #503 observation record: close that issue (ManddarinShop/Hikoutei#503)
# once uptime spans days with failures near zero.
#
# Columns: date,uptime_s,sync_mode,req_total,req_failures,http429,db_bytes,
#   qa_iterations,qa_failures,qa_ops_total,qa_ops_fail,qa_op_counters(JSON)

name: Ops metrics

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public health numbers
        id: health
        run: |
          set -euo pipefail
          # Tolerant fetch: a down edge still records a (blank) row instead
          # of failing the job — paging is health-ping's job, not this one's.
          body=$(curl -fsS --max-time 25 https://hikoutei.cloud/api/health || echo '{}')
          field() {
            printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>{s+=d}).on('end',()=>{const j=JSON.parse(s);console.log(($1) ?? '');});"
          }
          {
            echo "uptime=$(field 'j.uptimeS')"
            echo "mode=$(field 'j.syncMode')"
            echo "total=$(field 'j.requestTelemetry && j.requestTelemetry.total')"
            echo "failures=$(field 'j.requestTelemetry && j.requestTelemetry.failures')"
            echo "http429=$(field 'j.requestTelemetry && j.requestTelemetry.http429')"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch QA harness numbers
        id: qa
        run: |
          set -euo pipefail
          # Tolerant fetch, same policy as above: QA down still records a row.
          qbody=$(curl -fsS --max-time 25 https://hikoutei.cloud/api/qa-health || echo '{}')
          qfield() {
            printf '%s' "$qbody" | node -e "let s='';process.stdin.on('data',d=>{s+=d}).on('end',()=>{let j={};try{j=JSON.parse(s)}catch{};console.log(($1) ?? '');});"
          }
          {
            echo "iterations=$(qfield 'j.iterations')"
            echo "failures=$(qfield 'j.failures')"
            echo "ops_total=$(qfield 'j.opCounters ? Object.values(j.opCounters).reduce((a,c)=>a+(c.total||0),0) : undefined')"
            echo "ops_fail=$(qfield 'j.opCounters ? Object.values(j.opCounters).reduce((a,c)=>a+(c.fail||0),0) : undefined')"
            echo "counters=$(qfield 'j.opCounters ? JSON.stringify(j.opCounters) : undefined')"
          } >> "$GITHUB_OUTPUT"

      - name: Read SQLite size on the host
        id: dbsize
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEMO_SSH_HOST }}
          SSH_USER: ${{ secrets.DEMO_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/metrics_probe
          chmod 600 ~/.ssh/metrics_probe
          bytes=$(ssh -i ~/.ssh/metrics_probe -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 "${SSH_USER}@${SSH_HOST}" 'vol=$(docker volume ls --format "{{.Name}}" | grep demo-data | head -1); sudo stat -c%s "/var/lib/docker/volumes/${vol}/_data/demo.sqlite"')
          rm -f ~/.ssh/metrics_probe
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"

      - name: Append row and push (clean-base update)
        run: |
          set -euo pipefail
          # No `git pull --rebase` here: it fails (exit 128) when the
          # checkout carries local state. Rebase the base instead — fetch
          # and hard-reset BEFORE appending, so the tree is always clean.
          BRANCH="${GITHUB_REF_NAME:-main}"
          NEW_HEADER="date,uptime_s,sync_mode,req_total,req_failures,http429,db_bytes,qa_iterations,qa_failures,qa_ops_total,qa_ops_fail,qa_op_counters"
          sync_base() {
            git fetch origin "$BRANCH" --quiet
            git reset --hard "origin/$BRANCH" --quiet
          }
          ensure_header() {
            mkdir -p ops
            if [ ! -f ops/metrics.csv ]; then
              printf '%s\n' "$NEW_HEADER" > ops/metrics.csv
            elif [ "$(head -n 1 ops/metrics.csv)" = "date,uptime_s,sync_mode,req_total,req_failures,http429,db_bytes" ]; then
              # Old 7-column header: upgrade in place; old short rows read as empty.
              sed -i '1s/.*/date,uptime_s,sync_mode,req_total,req_failures,http429,db_bytes,qa_iterations,qa_failures,qa_ops_total,qa_ops_fail,qa_op_counters/' ops/metrics.csv
            fi
          }
          commit_row() {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ops/metrics.csv
            if git diff --quiet --cached; then
              echo "no change"
              return 1
            fi
            git commit -m "chore(ops): daily metrics" --quiet
            return 0
          }
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          COUNTERS_CSV=$(printf '%s' '${{ steps.qa.outputs.counters }}' | sed 's/"/""/g')
          ROW=$(printf '%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,"%s"' \
            "$TS" \
            '${{ steps.health.outputs.uptime }}' \
            '${{ steps.health.outputs.mode }}' \
            '${{ steps.health.outputs.total }}' \
            '${{ steps.health.outputs.failures }}' \
            '${{ steps.health.outputs.http429 }}' \
            '${{ steps.dbsize.outputs.bytes }}' \
            '${{ steps.qa.outputs.iterations }}' \
            '${{ steps.qa.outputs.failures }}' \
            '${{ steps.qa.outputs.ops_total }}' \
            '${{ steps.qa.outputs.ops_fail }}' \
            "$COUNTERS_CSV")
          append_row() {
            ensure_header
            printf '%s\n' "$ROW" >> ops/metrics.csv
          }
          sync_base
          append_row
          if ! commit_row; then exit 0; fi
          if git push --quiet origin "HEAD:$BRANCH"; then exit 0; fi
          # Lost a race with another writer: rebuild on the fresh base once.
          echo "push raced, retrying on fresh base"
          sync_base
          append_row
          if ! commit_row; then exit 0; fi
          git push --quiet origin "HEAD:$BRANCH"
