# Demo health ping (every 15 minutes).
#
# The ~10-minute crash flapping of Sep 2026 hid between daily checks, so
# this pings the public edge on a short cadence and fails loud otherwise.
# No SSH, no secrets: pure public-surface proof. Failure mails go to repo
# watchers (repo Watch settings); add a chat webhook when one exists.
#
# QA oracle watch (integrated here, not a separate workflow): the same tick
# also fetches /api/qa-health and fails on transport error, ok:false, or
# failures>0. One schedule instead of two keeps the ping and the filing in
# the same run, so the issue body always matches the payload that failed —
# a separate workflow would re-fetch minutes later and risk reporting a
# different seed/step. The filing step below (if: failure()) re-reads the
# saved payload and opens (or comments on) a "QA oracle failure" issue,
# deduped per seed so a stuck oracle does not spam issues.
#
# Failure triage (LLM): the filing step feeds the qa payload + recent
# metrics to the triage model and appends an "AI triage" section to the
# issue body. Additive-only, silently skipped without TRIAGE_LLM_API_KEY.
# QA oracle failures are rule-based P2 (label triage:P2).
#
# Dry-run: workflow_dispatch with triage_dry_run=true renders the issue
# body from .github/triage-fixtures/ (no issue is filed).

name: Health ping

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      triage_dry_run:
        description: "Render triage from fixtures without filing"
        type: boolean
        default: false

# GITHUB_TOKEN needs issues:write for the QA failure filing step below.
# Read-only checkout supplies the triage script + metrics tail + fixtures;
# the checks themselves stay curl-only with no other scopes.
permissions:
  contents: read
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Require sync mode on the public edge
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 25 https://hikoutei.cloud/api/health)
          echo "$body" | head -c 200
          echo
          echo "$body" | grep -Eq '"syncMode"[[:space:]]*:[[:space:]]*"sync"' || {
            echo "EDGE NOT SYNC"
            exit 1
          }
          echo "edge sync ok"

      - name: Check QA oracle health
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 25 https://hikoutei.cloud/api/qa-health)
          printf '%s' "$body" > "$RUNNER_TEMP/qa-health.json"
          python3 - <<'EOF'
          import json, os, sys
          h = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "qa-health.json")))
          print("iterations=%s failures=%s" % (h.get("iterations"), h.get("failures")))
          print("lastFailure=%s" % json.dumps(h.get("lastFailure")))
          if h.get("ok") is not True or (h.get("failures") or 0) > 0:
              print("QA ORACLE FAILURE")
              sys.exit(1)
          print("qa oracle ok")
          EOF

      - name: File QA oracle failure issue
        if: ${{ failure() || inputs.triage_dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIAGE_LLM_API_KEY: ${{ secrets.TRIAGE_LLM_API_KEY }}
          TRIAGE_LLM_MODEL: ${{ vars.TRIAGE_LLM_MODEL }}
          DRY_RUN: ${{ inputs.triage_dry_run }}
        run: |
          set -euo pipefail
          # Scoped to QA: a demo-only edge failure still fails this workflow
          # (loud page) but must not file a QA oracle issue.
          payload=$(cat "$RUNNER_TEMP/qa-health.json" 2>/dev/null || curl -fsS --max-time 25 https://hikoutei.cloud/api/qa-health || echo '{}')
          if [ "${DRY_RUN}" = "true" ]; then
            payload=$(cat .github/triage-fixtures/qa-sample.json)
            export TRIAGE_FIXTURE_RESPONSE=.github/triage-fixtures/llm-sample-response.json
          fi
          printf '%s' "$payload" > /tmp/qa-payload.json
          python3 - <<'EOF'
          import json
          try:
              h = json.load(open('/tmp/qa-payload.json'))
          except Exception:
              h = {}
          if not isinstance(h, dict):
              h = {}
          lf = h.get('lastFailure') or {}
          seed = lf.get('seed', h.get('seed', 'unknown'))
          step = lf.get('step', 'unknown')
          op = lf.get('op', 'unknown')
          open('/tmp/qa-title.txt', 'w').write(
              f"QA oracle failure \u2014 seed {seed} step {step} op {op}")
          summary = {k: h.get(k) for k in ('ok', 'seed', 'syncMode', 'iterations', 'failures')}
          lines = [
              'QA oracle failure detected by the Health ping workflow.',
              '',
              '## Health summary',
              '```json',
              json.dumps(summary, indent=2),
              '```',
              '',
              '## lastFailure',
              '```json',
              json.dumps(h.get('lastFailure'), indent=2),
              '```',
              '',
              '## Repro',
              f"Run the QA harness with `QA_SEED={seed}` and watch `/api/qa-health` "
              f"\u2014 the same seed replays the identical run (see qa/README.md).",
          ]
          open('/tmp/qa-body.md', 'w').write('\n'.join(lines) + '\n')
          # QA scope guard for the shell below.
          open('/tmp/qa-is-failure.txt', 'w').write(
              'yes' if (h.get('ok') is not True or (h.get('failures') or 0) > 0) else 'no')
          open('/tmp/qa-seed.txt', 'w').write(str(seed))
          EOF
          if [ "$(cat /tmp/qa-is-failure.txt)" != "yes" ]; then
            echo "no QA oracle failure in payload — demo-only failure, skipping issue"
            exit 0
          fi
          # Failure triage (LLM, additive-only): appends an "AI triage"
          # section to the body when the key is present and the model
          # returns valid JSON; otherwise the body stays as-is.
          tail -7 ops/metrics.csv > /tmp/metrics-tail.csv 2>/dev/null || true
          gh issue list -R ManddarinShop/Hikoutei-Website --state open \
            --json number,title --limit 50 > /tmp/open-issues.json 2>/dev/null \
            || echo '[]' > /tmp/open-issues.json
          if [ "${DRY_RUN}" = "true" ]; then
            echo '[]' > /tmp/open-issues.json
          fi
          .github/scripts/llm-triage.sh --mode qa --evidence /tmp/qa-payload.json \
            --metrics /tmp/metrics-tail.csv --open-issues /tmp/open-issues.json \
            --out /tmp/triage.md || true
          if [ -f /tmp/triage.md ]; then
            { echo; cat /tmp/triage.md; } >> /tmp/qa-body.md
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            echo "--- dry-run title ---"; cat /tmp/qa-title.txt; echo
            echo "--- dry-run body ---"; cat /tmp/qa-body.md
            exit 0
          fi
          gh label create "triage:P2" -R ManddarinShop/Hikoutei-Website \
            --color "0e8a16" --description "LLM-triaged QA oracle failure" \
            2>/dev/null || true
          seed=$(cat /tmp/qa-seed.txt)
          expected=$(cat /tmp/qa-title.txt)
          existing=$(gh issue list -R ManddarinShop/Hikoutei-Website --state open --json number,title --limit 50)
          match=$(printf '%s' "$existing" | python3 -c '
          import json, sys
          expected = sys.argv[1]
          issues = json.load(sys.stdin)
          hit = next((str(i["number"]) for i in issues if i.get("title", "") == expected), "")
          print(hit)
          ' "$expected")
          if [ -n "$match" ]; then
            echo "open issue #$match already tracks seed $seed — commenting only"
            gh issue comment "$match" -R ManddarinShop/Hikoutei-Website --body-file /tmp/qa-body.md
            gh issue edit "$match" -R ManddarinShop/Hikoutei-Website \
              --add-label "triage:P2" 2>/dev/null || true
          else
            gh issue create -R ManddarinShop/Hikoutei-Website --title "$(cat /tmp/qa-title.txt)" --label "triage:P2" --body-file /tmp/qa-body.md
          fi
